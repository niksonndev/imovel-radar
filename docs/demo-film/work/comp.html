<!DOCTYPE html>
<!-- onetake · Imóvel Radar · 15 s launch film · one continuous camera, every boundary carries · pt-BR -->
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Imóvel Radar · 15s</title>
<style>
@font-face{font-family:'Poppins';font-weight:500;src:url(fonts/poppins-500.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;src:url(fonts/poppins-600.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400 700;src:url(fonts/inter.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:400;src:url(fonts/jbmono.woff2) format('woff2')}
:root{--ground:#050505;--panel:#101114;--panel2:#181a1e;--line:#262a31;--ink:#f2f4f8;--mute:#8b93a1;--blue:#0A84FF;--green:#009866;--amber:#FF9F0A}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:'Inter','Noto Color Emoji',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
#bgc{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
.abs{position:absolute;will-change:transform,opacity,filter}
#logo{white-space:nowrap;font-family:'Poppins';font-weight:600;font-size:30px;letter-spacing:.01em}
#logo svg{width:30px;height:30px;vertical-align:-7px;margin-right:12px}
#bar{position:absolute;width:1560px;height:92px;left:0;top:0;white-space:pre}
#bar .prompt{position:absolute;left:36px;top:0;font-family:'JB';font-size:26px;color:var(--ink)}
#bar .caret{display:inline-block;width:14px;height:30px;background:var(--blue);vertical-align:-7px;margin-left:4px}
#bar .send{position:absolute;right:22px;top:8px;width:66px;height:66px;border-radius:50%;background:var(--blue);color:#fff;font-family:'Poppins';font-weight:600;font-size:28px;text-align:center;line-height:66px}
.chip{position:absolute;height:52px;line-height:52px;padding:0 18px;border-radius:26px;background:var(--panel2);border:1px solid var(--line);font-family:'Inter','Noto Color Emoji';font-weight:500;font-size:22px;color:var(--ink)}
.chip b{color:var(--blue);font-weight:600}
#sweep{position:absolute;left:0;top:0;width:1920px;height:1080px}
#notif{position:absolute;white-space:pre;font-family:'Inter','Noto Color Emoji';font-weight:600;font-size:28px;color:var(--ink)}
/* listing card: card content + (at the morph target) watch-row content, same element = identity survives */
#scard{position:absolute;width:1040px;height:390px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden;will-change:transform,opacity}
#scard .ph{position:absolute;left:0;top:0;width:470px;height:390px;overflow:hidden}
#scard .ph img{position:absolute;left:0;top:0;width:470px;height:390px;object-fit:cover}
#scard .c{position:absolute;left:506px;top:0;width:534px;height:390px;background:var(--panel)}
#scard .c .tit{position:absolute;left:0;top:26px;font-family:'Poppins';font-weight:600;font-size:32px;color:var(--ink);white-space:normal}
#scard .c .pr{position:absolute;left:0;top:100px;font-family:'Poppins';font-weight:600;font-size:46px;color:var(--green)}
#scard .c .rooms{position:absolute;left:0;top:188px;font-family:'Inter';font-weight:500;font-size:25px;color:var(--mute)}
#scard .c .m2{position:absolute;left:0;top:234px;font-family:'Inter';font-weight:500;font-size:25px;color:var(--mute)}
#scard .c .ver{position:absolute;left:0;top:300px;height:56px;padding:0 22px;line-height:56px;border-radius:28px;background:var(--blue);color:#fff;font-family:'Poppins';font-weight:600;font-size:23px}
/* watch-row content (shown once the card morphs to the row) */
#scard .rw{position:absolute;left:0;top:0;width:880px;height:170px;background:var(--panel);border:1px solid var(--line);border-radius:20px;visibility:hidden}
#scard .rw .ic{position:absolute;left:22px;top:20px;width:56px;height:56px;border-radius:14px;background:var(--amber);color:var(--ground);font-size:28px;text-align:center;line-height:56px}
#scard .rw .nm{position:absolute;left:106px;top:16px;font-family:'Poppins';font-weight:600;font-size:27px;color:var(--ink)}
#scard .rw .st{position:absolute;left:106px;top:96px;font-family:'Inter','Noto Color Emoji';font-weight:500;font-size:21px;color:var(--green)}
#scard .rw .plab{position:absolute;right:180px;top:112px;font-family:'JB';font-size:17px;color:var(--mute);text-align:right}
#price{position:absolute;white-space:pre;font-family:'JB';font-size:36px;color:var(--mute);text-align:right}
#price.down{color:var(--green)}
#pulse{position:absolute;width:56px;height:56px;border-radius:14px;border:2px solid var(--amber);visibility:hidden}
#drop{position:absolute;white-space:pre;font-family:'Inter','Noto Color Emoji';font-weight:600;font-size:26px;color:var(--green)}
#mkt{position:absolute;width:880px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);padding:20px 26px;font-family:'Inter';font-weight:500;font-size:25px;color:var(--ink);box-sizing:border-box}
#mkt b{color:var(--blue);font-weight:600}
#mkt small{display:block;margin-top:6px;font-family:'JB';font-size:16px;color:var(--amber)}
#endmark{white-space:nowrap;font-family:'Poppins';font-weight:600;font-size:62px;letter-spacing:.01em;color:var(--ink)}
#endmark svg{width:62px;height:62px;vertical-align:-16px;margin-right:20px}
#cta{white-space:pre;font-family:'Poppins';font-weight:500;font-size:30px;color:var(--mute)}
#cursor{position:absolute;width:28px;height:38px;will-change:transform}
#hud{position:absolute;right:14px;bottom:10px;font:13px 'JB',monospace;color:#c00;display:none}
</style>
</head>
<body>
<div id="stage">
<canvas id="bgc" width="1920" height="1080"></canvas>
<div id="world">
  <div id="logo" class="abs"></div>
  <div id="sweep" class="abs"></div>
  <div id="notif" class="abs"></div>
  <div id="scard" class="abs">
    <div class="ph"><img id="phimg" alt=""></div>
    <div class="c">
      <div class="tit">Apartamento em Ponta Verde</div>
      <div class="pr">R$ 2.100/mês</div>
      <div class="rooms">2 quarto(s)</div>
      <div class="m2">65 m² · Ponta Verde</div>
      <div class="ver">Ver anúncio</div>
    </div>
    <div class="rw">
      <div class="ic">▲</div><div class="nm">Acompanhando</div><div class="st">✅ No ar</div>
      <div class="plab">preço base</div>
    </div>
    <div id="pulse" class="abs"></div>
    <div id="price" class="abs"></div>
  </div>
  <div id="drop" class="abs"></div>
  <div id="mkt" class="abs"></div>
  <div id="endmark" class="abs"></div>
  <div id="cta" class="abs"></div>
  <div id="bar" class="abs"><span class="prompt"><span id="ptxt"></span><i class="caret" id="caret"></i></span><span class="send" id="send">→</span></div>
  <svg id="cursor" viewBox="0 0 32 42"><path d="M4 3 L28 21 L16 23 L24 39 L18 42 L11 26 L4 34 Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<div id="hud"></div>
</div>
<script src="motion.js"></script>
<script>
const {clamp,lerp,sstep,ssstep,spring:spr,ring,spline,ease,seg} = OM;
const FPS=30, DUR=15;
window.__meta={dur:DUR,fps:FPS,w:1920,h:1080};
const $=id=>document.getElementById(id);
function place(el,x,y,s=1,op=1,blur=0){ if(op<=0.004){el.style.opacity=0;return;} el.style.opacity=op;
  el.style.transform=`translate(${x}px,${y}px) scale(${s})`; el.style.filter=blur>0.2?`blur(${blur}px)`:'none'; }

// ── camera (world coords; frame shows 1920×1080 around (x,y) at zoom 1) ──
const KEYS=[
  {t:0,    x:960, y:560,  zoom:1.02},
  {t:2.7,  x:1000,y:640,  zoom:1.00, curve:ease.sineInOut},
  {t:3.9,  x:880, y:430,  zoom:1.45, curve:ease.expoInOut},   // onto the card (world center ~880,425)
  {t:4.6,  x:910, y:390,  zoom:1.65, curve:ease.quintInOut},
  {t:5.6,  x:930, y:345,  zoom:1.85, curve:ease.quintInOut},  // close on title/price
  {t:6.4,  x:960, y:480,  zoom:1.60, curve:ease.quintInOut},  // pull back to morph
  {t:7.6,  x:960, y:515,  zoom:1.75, curve:ease.cubicInOut},  // into the watch row (HOLD)
  {t:9.5,  x:960, y:515,  zoom:1.75, curve:ease.cubicInOut},  // end of stillness
  {t:10.6, x:1100,y:600, zoom:1.45, curve:ease.expoInOut},    // price roll + typing (row+bar visible)
  {t:11.5, x:960, y:560,  zoom:1.50, curve:ease.quintInOut},  // back to wide for market
  {t:12.3, x:960, y:560,  zoom:1.35, curve:ease.quintInOut},  // market answer
  {t:13.1, x:960, y:600,  zoom:1.08, curve:ease.quintInOut},  // fold into bar + end
  {t:14.1, x:960, y:610,  zoom:1.02, curve:ease.cubicInOut},  // end rest
];
const HITS=[[2.62,9,11],[4.5,8,10],[7.3,6,9],[10.7,9,11],[13.0,7,9]];
const handEnv=t=> sstep(0,0.6,t)*(1-sstep(13.4,14.0,t));
function camAt(t){
  const c=OM.camera(t,KEYS), e=handEnv(t)*3.2;
  let x=c.x+e*(Math.sin(1.6*t)+0.5*Math.sin(2.8*t+1))/c.zoom;
  let y=c.y+e*(Math.sin(1.3*t+2)+0.5*Math.sin(3.1*t))/c.zoom; let rot=c.rot;
  for(const [th,amp,decay] of HITS){ const s=OM.shake(t,th,{amp,decay,seed:Math.round(th*100)}); x+=s.x/c.zoom; y+=s.y/c.zoom; rot+=s.rot; }
  return {x,y,zoom:c.zoom,rot};
}
window.__motion=(t0,t1)=>{ return OM.screenTravel(camAt(t0),camAt(t1),camAt((t0+t1)/2)); };

// ── strings (pt-BR) ────────────────────────────────────────────────────
const TXT='Apartamento de 2 quartos na Ponta Verde, até R$ 2.500';
const CHIPS=['Aluguel','Apartamentos','Ponta Verde','até <b>R$ 2.500</b>','2+ quartos'];
// ── DOM build ──────────────────────────────────────────────────────────
const logo=$('logo'), ENDM=$('endmark');
logo.innerHTML=`<svg viewBox="0 0 24 24" width="30" height="30"><g fill="none" stroke="#0A84FF" stroke-width="2"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" opacity=".5"/></g><line x1="12" y1="12" x2="19" y2="6" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round"/><line x1="12" y1="12" x2="7" y2="16" stroke="#FF9F0A" stroke-width="2.2" stroke-linecap="round" opacity=".85"/></svg>Imóvel Radar`;
const chipEls=CHIPS.map((txt,i)=>{const s=document.createElement('span');s.className='chip';s.innerHTML=txt;document.querySelector('#world').appendChild(s);return s;});
const CHIPX=[560,790,1030,1210,1455];
$('notif').textContent='🔔 Novo imóvil';
$('mkt').innerHTML=`Média em <b>Ponta Verde</b> · aluguel<br>R$ 45/m² · 86 anúncios<small>dados de exemplo</small>`;
const sweep=$('sweep'); const swC=document.createElementNS('http://www.w3.org/2000/svg','svg');
swC.setAttribute('viewBox','0 0 1920 1080');swC.setAttribute('width','1920');swC.setAttribute('height','1080');sweep.appendChild(swC);
function drawSweep(t,cx,cy,k,rMax,op){
  const NS='http://www.w3.org/2000/svg'; swC.innerHTML=''; if(op<=0.01) return;
  const fr=document.createElementNS(NS,'circle'); fr.setAttribute('cx',cx);fr.setAttribute('cy',cy);fr.setAttribute('r',String(rMax*k));
  fr.setAttribute('fill','none');fr.setAttribute('stroke','#0A84FF');fr.setAttribute('stroke-width',`${(2/k)}`);fr.setAttribute('opacity',String(op*0.85));
  const a=0.5+t*8*Math.PI/3; const R=rMax*k;
  const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',String(cx));ln.setAttribute('y1',String(cy));
  ln.setAttribute('x2',String(cx+R*Math.cos(a)));ln.setAttribute('y2',String(cy+R*Math.sin(a)));
  ln.setAttribute('stroke','#0A84FF');ln.setAttribute('stroke-width',`${(3/k)}`);ln.setAttribute('opacity',String(op));
  swC.appendChild(fr); swC.appendChild(ln);
}

// ── hand ───────────────────────────────────────────────────────────────
const HAND=[
  {t:0.15,x:420,y:760},{t:2.0,x:1000,y:980},{t:2.14,x:1120,y:960},{t:2.45,x:1370,y:960},{t:2.60,x:1400,y:945},{t:2.70,x:1400,y:945},
  {t:4.1, x:780,y:700},{t:5.0, x:1020,y:560},{t:6.3, x:1180,y:820},{t:7.25,x:1180,y:760},
  {t:10.6,x:1200,y:480},{t:11.3,x:1240,y:880},{t:11.7,x:900,y:920},{t:13.0,x:950,y:980},
];
const hand=t=>spline(HAND,t);
const CLICKS=[2.60,7.25,11.3];

// ── ground ─────────────────────────────────────────────────────────────
function ground(cam){
  const c=$('bgc'), x=c.getContext('2d'); const W=1920,H=1080;
  x.setTransform(1,0,0,1,0,0); x.fillStyle='#050505'; x.fillRect(0,0,W,H);
  const la=OM.lattice(cam,{depth:1.22,spacing:52,px:1.5});
  x.setTransform(...la.matrix); x.fillStyle='rgba(120,132,150,0.16)';
  for(let yy=la.y0;yy<la.y1+la.spacing;yy+=la.spacing) for(let xx=la.x0;xx<la.x1+la.spacing;xx+=la.spacing) x.fillRect(xx,yy,la.r*2,la.r*2);
  x.setTransform(1,0,0,1,0,0);
  const g=x.createRadialGradient(W/2,H/2,260,W/2,H/2,1350); g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
}

// ── seek ───────────────────────────────────────────────────────────────
function seek(t){
  const CAM=camAt(t), M=OM.view(CAM);
  $('world').style.transform=`matrix(${M.join(',')})`;
  ground(CAM);

  // logo (brand anchor, folds into end)
  const lO=sstep(0.1,0.7,t)*(1-sstep(13.0,13.6,t));
  place(logo, 830, 40, lerp(1,1.15,ssstep(12.6,13.4,t)), lO);

  // ── BEAT 1 · the bar types / send / chips ────────────────────────────
  const bPr=OM.popIn(t,0.15,{zeta:0.6,omega:15,rise:26});
  place($('bar'),210,905+bPr.dy,bPr.s,bPr.op);
  const ty=OM.typeOn(t,0.4,TXT,{cps:44}); $('ptxt').innerHTML=ty.str.replace(/&/g,'&amp;');
  $('caret').style.opacity=(ty.caret&&t<2.5&&!ty.done)?1:0;
  const send=OM.press(t,CLICKS[0]); $('send').style.transform=`scale(${send.s})`; $('send').style.background=send.active?'var(--green)':'var(--blue)';
  const chipT=2.62;
  for(let i=0;i<chipEls.length;i++){
    const w=OM.wordRise(t,chipT+i*0.06,{zeta:0.62,omega:18,dist:14,s0:0.88,ds:0.12,fade:1.1});
    const e=chipEls[i];
    place(e,CHIPX[i],712-30+w.y, w.s*(1-ssstep(3.35,3.75,t)), clamp(t>chipT-0.05?1:0,0,1)*w.op);
  }

  // ── BEAT 2 · sweep arcs out of the confirmation into the card ────────
  const sk=OM.ease.expoOut(seg(t,3.6,4.7));
  const swAmp=OM.ease.quintOut(1-sstep(3.6,4.0,t));
  drawSweep(t,960,540,sk,1500,swAmp);
  const nop=(t>3.7&&t<5.9)?OM.wordRise(t,3.7,{zeta:0.6,omega:16,dist:16}).op:0;
  place($('notif'),300,120,1,nop);

  // the card: pops in, then (beat 3) morphs into the watch row (same element)
  const cIn=4.15;
  const pc=OM.popIn(t,cIn,{zeta:0.62,omega:15,rise:70,s0:0.82,ds:0.18,fade:1.4});
  const rowOn=ssstep(6.6,7.45,t);               // 0 -> 1 as card becomes the row
  const mT0=6.55, mT1=7.45;
  const showCard=t>=cIn-0.05 && t<100;
  const sc=$('scard');
  if(t<mT0){
    // card
    place(sc,360,230+pc.dy, pc.s, (t<cIn?0:clamp((t-cIn)/0.32,0,1))*pc.op, 0);
    sc.querySelector('.c').style.opacity=1; sc.querySelector('.ph').style.opacity=1;
    sc.querySelector('.rw').style.visibility='hidden';
  } else {
    // morph card rect -> watch row rect, content crossfades on same element
    const A={x:360,y:230,w:1040,h:390}, B={x:520,y:430,w:880,h:170};
    const mr=OM.morphRect(t,mT0,mT1,A,B,{curve:ease.quintInOut});
    const s1=mr.w/1040;
    place(sc, mr.x, mr.y, s1,1,0);
    const cc=ssstep(6.7,7.15,t), rw=ssstep(7.05,7.45,t);
    sc.querySelector('.c').style.opacity=(1-cc); sc.querySelector('.ph').style.opacity=(1-cc);
    const rwl=sc.querySelector('.rw'); rwl.style.visibility='visible'; rwl.style.opacity=rw;
  }
  // watch row content is fixed inside #scard at left 0 (its own local coords)

  // price + pulse live in the row's local coords (so they travel with the morph)
  const price=$('price'); const pulse=$('pulse');
  const rw=$('scard').querySelector('.rw');
  // pulse on the row during stillness (beat 4: 7.6-9.5)
  const pulseOn=t>7.4&&t<9.5 ? 0.45+0.55*Math.sin((t-7.4)*3.4) : 0;
  place(pulse, 22, 20, 0.5+0.5*ssstep(7.3,7.7,t), (t>7.3&&t<9.6)?pulseOn:0);

  // ── BEAT 5 · price rolls R$2.100 -> R$1.800 (green) + drop bubble ────
  const val=Math.round(2100-(2100-1800)*ease.cubicInOut(clamp((t-9.65)/0.85,0,1)));
  price.textContent='R$ '+val.toLocaleString('en-US')+'/mês';
  price.classList.toggle('down',val<=1860);
  place(price, 660, 110, 1, (t>9.5&&t<11.6?1:0), 0);
  const drp=sstep(10.2,10.5,t)*(1-sstep(11.9,12.3,t));
  place($('drop'), 1110, 300, 1, (t>10.15&&t<12.3)?drp:0); $('drop').textContent='📉 Preço caiu R$ 300';
  // user types follow-up
  if(t>10.3){ $('ptxt').innerHTML=OM.typeOn(t,10.4,'e o preço por m² na região?',{cps:48}).str; $('caret').style.opacity=(t>10.4&&t<11.4)?1:0; }

  // ── BEAT 6 · market answer folds into bar; end lockup ────────────────
  const mk=OM.popIn(t,11.7,{zeta:0.6,omega:15,rise:40,s0:0.9,ds:0.1,fade:1.3});
  const mf=sstep(12.5,13.1,t);
  place(mkt, 300, 600+mk.dy, lerp(1,0.45,mf), (t>11.7?mk.op:0)*(1-mf));
  const endOp=sstep(13.4,14.2,t);
  place($('bar'),210,880,1,1-endOp);
  ENDM.innerHTML=`<svg viewBox="0 0 24 24" width="62" height="62"><g fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9" opacity=".5"/></g><line x1="12" y1="12" x2="19" y2="6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><line x1="12" y1="12" x2="7" y2="16" stroke="#0A84FF" stroke-width="2.2" stroke-linecap="round" opacity=".85"/></svg>Imóvel Radar`;
  place(ENDM, 590, 430-40*endOp, 1, endOp, 0);
  $('cta').textContent='Começar grátis no Telegram';
  place($('cta'), 610, 640, 1, endOp*ssstep(14.0,14.5,t), 0);

  // cursor (world layer: inside #world so it aligns with elements)
  const cu=OM.cursor(t,HAND,CLICKS);
  $('cursor').style.opacity=(t>0.15&&t<12.9)?1:0;
  $('cursor').style.transform=`translate(${(cu.x-3)}px,${(cu.y-3)}px) scale(${cu.s})`;
  $('hud').textContent='t='+t.toFixed(3);
  return Promise.resolve();
}
window.__seek=async t=>{ await seek(t); return true; };
window.__ready=document.fonts.ready.then(()=>{ $('phimg').src='photo.jpg'; return seek(0); });
const q=new URLSearchParams(location.search);
if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) $('hud').style.display='block';
if(q.has('play')) __ready.then(()=>{const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();});
</script>
</body>
</html>
