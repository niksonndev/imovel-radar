[package]
name = "whatsapp-bot"
version = "0.1.0"
edition = "2021"
publish = false
description = "André Assistente Imobiliário pelo WhatsApp (cliente whatsapp-rust, sempre ligado)"

[[bin]]
name = "whatsapp-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Só para o snapshot consistente da sessão (VACUUM INTO). Reusa o mesmo
# libsqlite3-sys 0.37 bundled que o store do whatsapp-rust já linka.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
whatsapp-rust = { version = "0.7", default-features = false, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
