[project]
name = "imovel-radar-scraper"
version = "0.1.0"
description = "FastAPI service for OLX scraping — sole owner of the database"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "apscheduler==3.11.0",
    "cloudscraper==1.2.71",
    "beautifulsoup4==4.12.0",
    "lxml==5.3.0",
    "python-dotenv==1.0.0",
    "tzdata==2024.1",
    "sqlmodel==0.0.38",
    "alembic==1.18.5",
    "imovel-radar-shared-models",
]

[dependency-groups]
dev = [
    "poethepoet>=0.30.0",
    "pyright>=1.1.0",
    "pytest==8.4.2",
    "ruff==0.16.0",
]

[tool.poe.tasks]
test = "pytest -v"
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyright"
check = ["lint", "typecheck", "test"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv", "data", "**/node_modules", "**/.*"]
extraPaths = ["../../packages/shared-models/src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.uv]
package = false

[tool.uv.sources]
imovel-radar-shared-models = { path = "../../packages/shared-models", editable = true }

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config.py" = ["E501"]