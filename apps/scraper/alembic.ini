[alembic]
# path to migration scripts
script_location = alembic
# sqlite url (substituído em runtime por database/db.py -> app_config.DB_PATH)
sqlalchemy.url = sqlite:///imovelradar.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = WARN
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
