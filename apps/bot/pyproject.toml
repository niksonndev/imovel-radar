[project]
name = "imovel-radar-bot"
version = "0.1.0"
description = "Telegram bot for Imóvel Radar — webhook + shared Postgres direct access (ADR 0004/0005)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-telegram-bot[job-queue]>=22.0,<23.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.3.4",
    "sqlmodel==0.0.38",
    "boto3>=1.34.0",
    "tzdata==2024.1",
    "imovel-radar-shared-models",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "pyright>=1.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
imovel-radar-shared-models = { path = "../../packages/shared-models", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config.py" = ["E501"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*"]
extraPaths = ["../../packages/shared-models/src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
