[project]
name = "imovel-radar-bot"
version = "0.1.0"
description = "Telegram bot client for Imóvel Radar — consumes the Scraper API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "pyright>=1.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config.py" = ["E501"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*"]
extraPaths = ["../../packages/shared-models/src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
