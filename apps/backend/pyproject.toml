[project]
name = "imovel-radar-backend"
version = "0.1.0"
description = "Telegram bot + OLX scraper + scheduler for Imóvel Radar"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # deixa false por enquanto, true é mais rígido depois

[[tool.mypy.overrides]]
module = ["cloudscraper.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # erros, "F" pega bugs tipo variável indefinida, "I" ordena imports

[tool.ruff.lint.per-file-ignores]
"config.py" = ["E501"]