name: Infra Deploy (scraper lambda)

# Deploy da Lambda de coleta (scraper) via Terraform + EventBridge.
# Gatilhos: mudanças em apps/scraper, infra/ ou no próprio workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/scraper/**'
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_VAR_region: sa-east-1
  STATE_BUCKET: imovel-radar-tfstate
  STATE_KEY: imovel-radar/terraform.tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste123
          POSTGRES_DB: imovel_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imovel_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/scraper/uv.lock'

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read DATABASE_URL from SSM
        run: |
          echo "DATABASE_URL=$(aws ssm get-parameter --name /imovel-radar/prod/database_url --with-decryption --query Parameter.Value --output text)" >> "$GITHUB_ENV"

      - name: Install deps + tests (gate)
        working-directory: apps/scraper
        run: |
          uv python install
          uv sync --frozen
          uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://postgres:teste123@localhost:5432/imovel_radar

      - name: Run migrations (gate - bloqueia deploy em falha)
        working-directory: apps/scraper
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build Lambda zip
        working-directory: apps/scraper
        run: |
          uv export --no-dev --frozen -o /tmp/requirements.txt
          grep -vi 'shared-models' /tmp/requirements.txt > /tmp/requirements-no-shared.txt
          mkdir -p dist/python
          uv pip install --target dist/python -r /tmp/requirements-no-shared.txt
          cp -r ../../packages/shared-models/src/shared_models dist/python/shared_models
          cp lambda_handler.py config.py dist/python/
          cp -r scheduler collector database dist/python/
          cd dist/python && zip -q -r ../lambda.zip .

      - name: Terraform plan + apply
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform plan \
            -var "zip_path=../apps/scraper/dist/lambda.zip" \
            -var "database_url=${{ env.DATABASE_URL }}"
          terraform apply -auto-approve \
            -var "zip_path=../apps/scraper/dist/lambda.zip" \
            -var "database_url=${{ env.DATABASE_URL }}"

      - name: Post-deploy smoke (10 páginas)
        run: |
          FN="imovel-radar-prod-scraper-collect"
          aws lambda update-function-configuration --function-name "$FN" \
            --environment "Variables={DATABASE_URL=${{ env.DATABASE_URL }},LOG_LEVEL=INFO,SCRAPER_MAX_PAGES=10}" >/dev/null
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"source":"aws.events","detail-type":"Scheduled Event"}' \
            /tmp/invoke.json
          cat /tmp/invoke.json
          # restaura o env padrão (SCRAPER_MAX_PAGES=100)
          aws lambda update-function-configuration --function-name "$FN" \
            --environment "Variables={DATABASE_URL=${{ env.DATABASE_URL }},LOG_LEVEL=INFO,SCRAPER_MAX_PAGES=100}" >/dev/null
