name: Infra Deploy (scraper lambda)

# Deploy da Lambda de coleta (scraper) via Terraform.
# Gatilhos: mudanças em apps/scraper, packages/shared-models, infra/ ou no
# próprio workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/scraper/**'
      - 'packages/shared-models/**'
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  TF_VAR_region: sa-east-1
  STATE_BUCKET: imovel-radar-tfstate
  STATE_KEY: imovel-radar/terraform.tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste123
          POSTGRES_DB: imovel_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imovel_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/scraper/uv.lock

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read DATABASE_URL from SSM
        run: |
          RAW="$(aws ssm get-parameter --name /imovel-radar/prod/database_url --with-decryption --query Parameter.Value --output text)"
          # SQLAlchemy default dialect is psycopg2; apps depend on psycopg (v3).
          case "$RAW" in
            postgresql+psycopg://*) DATABASE_URL="$RAW" ;;
            postgresql+psycopg2://*) DATABASE_URL="postgresql+psycopg://${RAW#postgresql+psycopg2://}" ;;
            postgresql://*) DATABASE_URL="postgresql+psycopg://${RAW#postgresql://}" ;;
            postgres://*) DATABASE_URL="postgresql+psycopg://${RAW#postgres://}" ;;
            *) DATABASE_URL="$RAW" ;;
          esac
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Check Neon pooled URL
        run: |
          if [[ "$DATABASE_URL" == *"neon.tech"* && "$DATABASE_URL" != *"-pooler"* ]]; then
            echo "::error::DATABASE_URL do Neon deve usar o endpoint pooled (host com -pooler)"
            exit 1
          fi

      - name: Install deps + tests (gate)
        working-directory: apps/scraper
        run: |
          uv python install
          uv sync --frozen
          uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://postgres:teste123@localhost:5432/imovel_radar

      - name: Run migrations (gate - bloqueia deploy em falha)
        working-directory: apps/scraper
        run: uv run alembic upgrade head

      - name: Build scraper Lambda zip
        working-directory: apps/scraper
        run: |
          uv export --no-dev --frozen -o /tmp/requirements.txt
          grep -vi 'shared-models' /tmp/requirements.txt > /tmp/requirements-no-shared.txt
          mkdir -p dist/python
          uv pip install --target dist/python -r /tmp/requirements-no-shared.txt
          cp -r ../../packages/shared-models/src/shared_models dist/python/shared_models
          cp lambda_handler.py config.py dist/python/
          cp -r scheduler collector database stats dist/python/
          cd dist/python && zip -q -r ../lambda.zip .

      - name: Terraform plan + apply
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
          terraform plan \
            -var "scraper_zip_path=../apps/scraper/dist/lambda.zip" \
            -var "database_url=$DATABASE_URL"
          terraform apply -auto-approve \
            -var "scraper_zip_path=../apps/scraper/dist/lambda.zip" \
            -var "database_url=$DATABASE_URL"

      # Smoke: payload smoke=true (2 páginas, sem self-invoke / deactivate).
      # NÃO usar evento de cron e NÃO mutar SCRAPER_MAX_PAGES — isso já
      # disparou full scrape e derrubou a cadeia diária.
      - name: Post-deploy smoke (2 páginas, sem cadeia)
        run: |
          FN="imovel-radar-prod-scraper-collect"
          CONC=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name ConcurrentExecutions \
            --dimensions Name=FunctionName,Value="$FN" \
            --start-time "$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 60 \
            --statistics Maximum \
            --query 'Datapoints[].Maximum' \
            --output text | awk 'BEGIN {m=0} {for(i=1;i<=NF;i++) if($i+0>m) m=$i+0} END {print m}')
          if awk "BEGIN {exit !($CONC >= 1)}"; then
            echo "Skip smoke: Lambda já em execução (ConcurrentExecutions=$CONC). Evita cortar o scrape diário."
            exit 0
          fi
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"smoke":true,"listing_kind":"aluguel","market":"maceio"}' \
            /tmp/invoke.json
          cat /tmp/invoke.json
          python3 -c 'import json,sys; body=json.load(open("/tmp/invoke.json")); body=json.loads(body) if isinstance(body,str) else body; sys.exit(0 if body.get("success") else 1)'

      # NEXT_PUBLIC_* entra no bundle no build. Grava a URL e só rebuilda
      # produção quando ela mudou. Secrets: VERCEL_TOKEN, VERCEL_PROJECT_ID
      # e, se o projeto estiver num time, VERCEL_ORG_ID.
      - name: Sync market stats URL to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Public team slug id (not a secret). Override via repo Variable if it moves.
          VERCEL_ORG_ID: team_yOpWUlQdbdJgfNgoOrFQcJWC
        run: bash .github/scripts/sync-market-stats-url.sh
