name: Scraper Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/scraper/**"
      - ".github/workflows/scraper-tests.yml"
  pull_request:
    paths:
      - "apps/scraper/**"
      - ".github/workflows/scraper-tests.yml"

env:
  DATABASE_URL: postgresql+psycopg://postgres:teste123@localhost:5432/imovel_radar

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste123
          POSTGRES_DB: imovel_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imovel_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "apps/scraper/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
