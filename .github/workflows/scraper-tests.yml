name: Scraper Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/scraper/**"
      - ".github/workflows/scraper-tests.yml"
  pull_request:
    paths:
      - "apps/scraper/**"
      - ".github/workflows/scraper-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "apps/scraper/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
