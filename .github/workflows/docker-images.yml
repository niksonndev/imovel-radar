name: Docker images (GHCR)

# Builda e publica as imagens do scraper e do bot no GitHub Container Registry.
# Build context = raiz do monorepo (os apps dependem de packages/shared-models).
# Tags: latest + sha (branch default), semver (tags v*).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/scraper/**'
      - 'apps/bot/**'
      - 'packages/shared-models/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    paths:
      - 'apps/scraper/**'
      - 'apps/bot/**'
      - 'packages/shared-models/**'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Namespace GHCR da conta que publica as imagens
  IMAGE_BASE: ghcr.io/niksonndev/imovel-radar

jobs:
  docker:
    name: Build/push imagem-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scraper
          - name: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Em PR valida o build (não publica); em push/tag/manual publica.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
