services:
  - type: web
    name: imovel-radar-whatsapp-bot
    runtime: docker
    plan: starter
    region: ohio
    numInstances: 1
    dockerfilePath: ./apps/whatsapp-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAIR_SECRET
        generateValue: true
      - key: WHATSAPP_SESSION_PATH
        value: /data/whatsapp.db
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ALERT_NL_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
