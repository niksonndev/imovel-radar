services:
  - type: web
    name: imovel-radar-whatsapp-bot
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    dockerfilePath: ./apps/whatsapp-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Só builda quando algo do próprio bot muda. Sem filtro, qualquer push em
    # `main` (frontend, scraper, bot do Telegram) reiniciava este container — e um
    # reinício derruba a conexão do WhatsApp e invalida o QR aberto no /pair.
    # O Dockerfile só copia apps/whatsapp-bot/{Cargo.*,src,entrypoint.sh}, então
    # nada fora dessa pasta pode mudar a imagem. `render.yaml` entra na lista
    # porque mudanças nas envVars do blueprint só valem depois de um deploy.
    buildFilter:
      paths:
        - apps/whatsapp-bot/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAIR_SECRET
        generateValue: true
      - key: WHATSAPP_SESSION_PATH
        value: /data/whatsapp.db
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ALERT_NL_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
