services:
  - type: web
    name: imovel-radar-whatsapp-bot
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    dockerfilePath: ./apps/whatsapp-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Só builda quando algo do próprio bot muda. Sem filtro, qualquer push em
    # `main` (frontend, scraper) reiniciava este container — e um
    # reinício derruba a conexão do WhatsApp e invalida o QR aberto no /pair.
    # O Dockerfile só copia apps/whatsapp-bot/{Cargo.*,src,entrypoint.sh}, então
    # nada fora dessa pasta pode mudar a imagem. `render.yaml` entra na lista
    # porque mudanças nas envVars do blueprint só valem depois de um deploy.
    buildFilter:
      paths:
        - apps/whatsapp-bot/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAIR_SECRET
        generateValue: true
      - key: WHATSAPP_SESSION_PATH
        value: /data/whatsapp.db
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.4-mini
      - key: ALERT_NL_ENABLED
        value: "true"
      # Cobrança do Radar Pro. Os segredos ficam só no painel (sync: false); os
      # preços ficam aqui para o valor anunciado no chat ser o mesmo cobrado.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PRO_MENSAL_CENTS
        value: "1990"
      - key: PRO_MENSAL_DAYS
        value: "30"
      - key: PRO_SEMESTRAL_CENTS
        value: "9999"
      - key: PRO_SEMESTRAL_DAYS
        value: "180"
      - key: LOG_LEVEL
        value: INFO
      # Links de /privacidade e /termos enviados pelo bot. O fallback no código
      # (imovel-radar.vercel.app) devolvia 404; trocar aqui quando o domínio
      # próprio do André estiver no ar.
      - key: PUBLIC_SITE_URL
        value: https://imovel-radar-frontend.vercel.app
