[project]
name = "imovel-radar-shared-models"
version = "0.1.0"
description = "Pydantic schemas compartilhados entre scraper e bot do Imóvel Radar"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]